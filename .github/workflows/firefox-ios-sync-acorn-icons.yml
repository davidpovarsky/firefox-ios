name: Sync Icons from Acorn repo

on: 
    workflow_dispatch:
    schedule:
      - cron: '0 12 * * SUN'

jobs:
    download_icons_if_needed:
        runs-on: ubuntu-latest

        steps:
            - name: Live Activity · refresh
              uses: davidpovarsky/github-automation/live-refresh@main
              continue-on-error: true
              with:
                event: refresh
                device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
                token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
                github_token: ${{ github.token }}
            - name: Checkout code
              uses: actions/checkout@v3
    
            - name: Live Activity · refresh
              uses: davidpovarsky/github-automation/live-refresh@main
              continue-on-error: true
              with:
                event: refresh
                device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
                token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
                github_token: ${{ github.token }}
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
               python-version: '3.x'
    
            - name: Live Activity · refresh
              uses: davidpovarsky/github-automation/live-refresh@main
              continue-on-error: true
              with:
                event: refresh
                device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
                token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
                github_token: ${{ github.token }}
            - name: Install dependencies
              run: |
               python -m pip install --upgrade pip
               pip install requests
    
            - name: Live Activity · refresh
              uses: davidpovarsky/github-automation/live-refresh@main
              continue-on-error: true
              with:
                event: refresh
                device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
                token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
                github_token: ${{ github.token }}
            - name: Download Acorn icons
              run: |
               python sync_acorn_icons.py
            
            - name: Live Activity · refresh
              uses: davidpovarsky/github-automation/live-refresh@main
              continue-on-error: true
              with:
                event: refresh
                device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
                token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
                github_token: ${{ github.token }}
            - name: Check changes
              run: |
                if [[ $(git status --porcelain) ]]; then
                    echo "changes_detected=true" >> $GITHUB_ENV 
                fi

            - name: Live Activity · refresh
              if: ${{ env.changes_detected }}
              uses: davidpovarsky/github-automation/live-refresh@main
              continue-on-error: true
              with:
                event: refresh
                device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
                token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
                github_token: ${{ github.token }}
            - name: Commit if needed 
              if: ${{ env.changes_detected }}
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git add latest_acorn_release.json firefox-ios/Client/Assets/Images.xcassets/ BrowserKit/Sources/Common/Constants/StandardImageIdentifiers.swift
                git commit -m "Updated Icons from Acorn repo"

            - name: Live Activity · refresh
              if: ${{ env.changes_detected }}
              uses: davidpovarsky/github-automation/live-refresh@main
              continue-on-error: true
              with:
                event: refresh
                device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
                token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
                github_token: ${{ github.token }}
            - name: Create Pull Request
              if: ${{ env.changes_detected }}
              uses: peter-evans/create-pull-request@v6
              with:
                  author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
                  committer: GitHub <noreply@github.com>
                  title: Refactor FXIOS [Icons] Update Firefox icons from Acorn repo
                  branch: update-firefox-project-with-acorn-icons
                  token: ${{ secrets.GITHUB_TOKEN }}
